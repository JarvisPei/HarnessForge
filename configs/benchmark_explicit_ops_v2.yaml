name: benchmark_explicit_ops_v2
output_dir: outputs/benchmark_explicit_ops_v2
weak:
  role: weak
teacher:
  role: teacher
harness:
  system_prompt_path: prompts/weak_system.md
  skills_dir: harness/skills
  guidelines_dir: harness/guidelines
  validators_dir: harness/validators
  tools_dir: harness/tools
  runtime_policies_dir: harness/runtime_policies
evolve_iterations: 3
transfer_context_mode: feedback_only
repair_mode: focused
inner_repair_attempts: 1
train_tasks:
  - id: train_explicit_labels_block
    instruction: |
      Compute the final inventory count from this explicit operation log.

      Unit: labels
      Initial: 12,480
      Operations:
      + 47 * 83
      - 2,918
      + 19 * 64
      - 875
      + 6 * 147
      - 1,309

      Return the final count in labels with one short explanation sentence.
    expected_answer: "13,377 labels remain."
    rubric: |
      Correct computation is 12480 + 47*83 - 2918 + 19*64 - 875 + 6*147 - 1309 = 13377. A reliable harness should parse explicit signed operations and use deterministic arithmetic rather than weak-model mental arithmetic.
  - id: train_explicit_cards_jsonish
    instruction: |
      Determine the final count from this explicit signed update object.

      {
        "unit": "cards",
        "initial": "8,760",
        "updates": ["+14*222", "-1,935", "+63*18", "-741", "+205", "-2*409"]
      }

      Return the final count in cards with one short explanation sentence.
    expected_answer: "9,713 cards remain."
    rubric: |
      Correct computation is 8760 + 14*222 - 1935 + 63*18 - 741 + 205 - 2*409 = 9713. A reliable harness should treat JSON-like signed operation lists as the same latent schema as block logs.
dev_probe_tasks:
  - id: dev_explicit_tags_inline
    instruction: |
      Use the explicit signed update list to compute the final count.
      unit=tags
      start=20,500
      updates=[+116*45, -3,138, -11,107, +29*132, -906, +7*275]
      Return the final count in tags with one short explanation sentence.
    expected_answer: "16,322 tags remain."
    rubric: |
      Correct computation is 20500 + 116*45 - 3138 - 11107 + 29*132 - 906 + 7*275 = 16322.
  - id: dev_explicit_stickers_table
    instruction: |
      Calculate the final count from this signed-operation table.

      unit: stickers
      initial: 9,800

      | sign | value |
      | --- | --- |
      | + | 12 * 336 |
      | - | 2,750 |
      | - | 490 |
      | + | 17 * 124 |
      | - | 36 * 9 |
      | + | 805 |

      Return the final count in stickers with one short explanation sentence.
    expected_answer: "13,181 stickers remain."
    rubric: |
      Correct computation is 9800 + 12*336 - 2750 - 490 + 17*124 - 36*9 + 805 = 13181.
  - id: dev_explicit_vouchers_semicolon
    instruction: |
      Compute the final count from the explicit signed operations:
      unit: vouchers; initial: 18,750; operations: +72*31; -906; -10,004; +18*144; -3*205; +4,821.
      Return the final count in vouchers with one short explanation sentence.
    expected_answer: "16,870 vouchers remain."
    rubric: |
      Correct computation is 18750 + 72*31 - 906 - 10004 + 18*144 - 3*205 + 4821 = 16870.
blind_test_tasks:
  - id: blind_explicit_badges_reordered_jsonish
    instruction: |
      Determine the final inventory count.

      {
        "updates": ["+118*52", "-2,140", "-12,006", "+41*137", "-875", "+6*420"],
        "initial": "34,000",
        "unit": "badges"
      }

      Return the final count in badges with one short explanation sentence.
    expected_answer: "33,252 badges remain."
    rubric: |
      Correct computation is 34000 + 118*52 - 2140 - 12006 + 41*137 - 875 + 6*420 = 33252.
  - id: blind_explicit_tickets_semicolon
    instruction: |
      Compute the final count from the explicit signed operations:
      unit: tickets; initial: 27,640; operations: +84*29; -1,705; -8,016; +23*118; -4*206; +3,950.
      Return the final count in tickets with one short explanation sentence.
    expected_answer: "26,195 tickets remain."
    rubric: |
      Correct computation is 27640 + 84*29 - 1705 - 8016 + 23*118 - 4*206 + 3950 = 26195.
